<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">Pwnbox Themes</title>
  <desc id="desc">Community theme packages for Pwnbox: one palette and one wallpaper for every app.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070910"/>
      <stop offset="0.55" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#120d14"/>
    </linearGradient>
    <radialGradient id="glow-blue" cx="0.12" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#2f5cff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#2f5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-warm" cx="0.9" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#ff6a3d" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8ff"/>
      <stop offset="0.5" stop-color="#4dd6e8"/>
      <stop offset="1" stop-color="#c792ea"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="22" fill="url(#glow-blue)"/>
  <rect width="1280" height="340" rx="22" fill="url(#glow-warm)"/>
  <rect x="1" y="1" width="1278" height="338" rx="21" fill="none" stroke="#272c38"/>

  <text x="64" y="92" fill="#7f8798" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" letter-spacing="5">COMMUNITY THEMES FOR</text>
  <text x="62" y="166" fill="#f2f5ff" font-family="DejaVu Sans, Verdana, sans-serif" font-size="62" font-weight="bold" letter-spacing="1">PWNBOX <tspan fill="#6ea8ff">THEMES</tspan></text>
  <rect x="64" y="192" width="500" height="3" rx="1.5" fill="url(#line)"/>
  <text x="64" y="235" fill="#c6d0e8" font-family="DejaVu Sans, Verdana, sans-serif" font-size="19">One palette. One wallpaper.</text>
  <text x="64" y="263" fill="#c6d0e8" font-family="DejaVu Sans, Verdana, sans-serif" font-size="19">Every app on the desktop.</text>
  <text x="64" y="302" fill="#727b90" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" letter-spacing="1">INSTALL WITH ONE SCRIPT  /  CREATE WITH ONE FILE  /  SHARE WITH A PR</text>

  <g transform="translate(700 66)">
    <rect width="516" height="94" rx="14" fill="#0d1018" fill-opacity="0.72" stroke="#242a36"/>
    <text x="22" y="29" fill="#d7e0ff" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" font-weight="bold" letter-spacing="2">MIDNIGHT</text>
    <text x="404" y="29" fill="#59637a" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" text-anchor="end">DEEP NAVY</text>
    <g transform="translate(22 46)">
      <rect width="26" height="20" rx="4" fill="#0b1020"/>
      <rect x="30" width="26" height="20" rx="4" fill="#ff6b81"/>
      <rect x="60" width="26" height="20" rx="4" fill="#5ee6a8"/>
      <rect x="90" width="26" height="20" rx="4" fill="#ffd166"/>

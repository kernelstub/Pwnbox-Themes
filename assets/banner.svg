      <rect x="210" width="26" height="20" rx="4" fill="#c6d0e8"/>
      <rect x="240" width="26" height="20" rx="4" fill="#59648c"/>
      <rect x="270" width="26" height="20" rx="4" fill="#ff8fa0"/>
      <rect x="300" width="26" height="20" rx="4" fill="#7cf0bc"/>
      <rect x="330" width="26" height="20" rx="4" fill="#ffe08a"/>
      <rect x="360" width="26" height="20" rx="4" fill="#8fbcff"/>

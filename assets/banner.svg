    <g transform="translate(22 46)">
      <rect width="26" height="20" rx="4" fill="#140f0d"/>
      <rect x="30" width="26" height="20" rx="4" fill="#ff6b5e"/>
      <rect x="60" width="26" height="20" rx="4" fill="#a8c06a"/>
      <rect x="90" width="26" height="20" rx="4" fill="#ffc66d"/>
      <rect x="120" width="26" height="20" rx="4" fill="#7fa6c9"/>
      <rect x="150" width="26" height="20" rx="4" fill="#d48fb8"/>

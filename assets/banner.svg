<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">Pwnbox Themes</title>
  <desc id="desc">Community theme packages for Pwnbox: one palette and one wallpaper for every app.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070910"/>
      <stop offset="0.55" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#120d14"/>
    </linearGradient>
    <radialGradient id="glow-blue" cx="0.12" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#2f5cff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#2f5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-warm" cx="0.9" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#ff6a3d" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8ff"/>
      <stop offset="0.5" stop-color="#4dd6e8"/>
      <stop offset="1" stop-color="#c792ea"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="22" fill="url(#glow-blue)"/>
  <rect width="1280" height="340" rx="22" fill="url(#glow-warm)"/>
  <rect x="1" y="1" width="1278" height="338" rx="21" fill="none" stroke="#272c38"/>

  <text x="64" y="92" fill="#7f8798" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" letter-spacing="5">COMMUNITY THEMES FOR</text>
  <text x="62" y="166" fill="#f2f5ff" font-family="DejaVu Sans, Verdana, sans-serif" font-size="62" font-weight="bold" letter-spacing="1">PWNBOX <tspan fill="#6ea8ff">THEMES</tspan></text>
  <rect x="64" y="192" width="500" height="3" rx="1.5" fill="url(#line)"/>
  <text x="64" y="235" fill="#c6d0e8" font-family="DejaVu Sans, Verdana, sans-serif" font-size="19">One palette. One wallpaper.</text>
  <text x="64" y="263" fill="#c6d0e8" font-family="DejaVu Sans, Verdana, sans-serif" font-size="19">Every app on the desktop.</text>
  <text x="64" y="302" fill="#727b90" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" letter-spacing="1">COPY ONE FOLDER  /  EDIT ONE FILE  /  SHARE WITH A PR</text>

  <g transform="translate(700 66)">
    <rect width="516" height="94" rx="14" fill="#0d1018" fill-opacity="0.72" stroke="#242a36"/>
    <text x="22" y="29" fill="#e6e6e6" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" font-weight="bold" letter-spacing="2">TEMPLATE</text>
    <text x="404" y="29" fill="#59637a" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" text-anchor="end">START HERE</text>
    <g transform="translate(22 46)">
      <rect width="26" height="20" rx="4" fill="#101014"/>
      <rect x="30" width="26" height="20" rx="4" fill="#ff7a90"/>
      <rect x="60" width="26" height="20" rx="4" fill="#8fe3a8"/>
      <rect x="90" width="26" height="20" rx="4" fill="#f3d489"/>
      <rect x="120" width="26" height="20" rx="4" fill="#7fb3ff"/>
      <rect x="150" width="26" height="20" rx="4" fill="#d0a8f5"/>
      <rect x="180" width="26" height="20" rx="4" fill="#7fe0e6"/>
      <rect x="210" width="26" height="20" rx="4" fill="#c9d3e0"/>
      <rect x="240" width="26" height="20" rx="4" fill="#5f6b7a"/>
      <rect x="270" width="26" height="20" rx="4" fill="#ff9eae"/>
      <rect x="300" width="26" height="20" rx="4" fill="#a8edbd"/>
      <rect x="330" width="26" height="20" rx="4" fill="#f7e0a8"/>
      <rect x="360" width="26" height="20" rx="4" fill="#a3c8ff"/>
      <rect x="390" width="26" height="20" rx="4" fill="#e0c2fb"/>
      <rect x="420" width="26" height="20" rx="4" fill="#9cebf0"/>
      <rect x="450" width="26" height="20" rx="4" fill="#f5f8ff"/>
    </g>
  </g>

  <g transform="translate(700 178)">
    <rect width="516" height="94" rx="14" fill="#0d1018" fill-opacity="0.5" stroke="#394050" stroke-dasharray="7 7"/>
    <text x="22" y="39" fill="#e6e6e6" font-family="DejaVu Sans, Verdana, sans-serif" font-size="17" font-weight="bold" letter-spacing="2">YOUR THEME</text>
    <text x="22" y="65" fill="#7f8798" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13">Copy themes/_template, validate it, and open a PR.</text>
  </g>
</svg>

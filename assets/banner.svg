      <rect x="210" width="26" height="20" rx="4" fill="#d8c3b8"/>
      <rect x="240" width="26" height="20" rx="4" fill="#765e4f"/>
      <rect x="270" width="26" height="20" rx="4" fill="#ff8a80"/>
      <rect x="300" width="26" height="20" rx="4" fill="#c2d68b"/>

      <rect x="420" width="26" height="20" rx="4" fill="#74e4f2"/>
      <rect x="450" width="26" height="20" rx="4" fill="#f2f6ff"/>
    </g>
  </g>

  <g transform="translate(700 178)">
    <rect width="516" height="94" rx="14" fill="#0d1018" fill-opacity="0.72" stroke="#242a36"/>
    <text x="22" y="29" fill="#f0ddd2" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" font-weight="bold" letter-spacing="2">EMBER</text>

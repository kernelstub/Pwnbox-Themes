name: Validate themes

on:
  push:
    branches: [main]
    paths:
      - "themes/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "themes/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate theme packages
        run: python3 scripts/validate-theme.py --strict

      - name: Shell syntax
        run: bash -n scripts/install-theme.sh scripts/render-preview.sh

      - name: ShellCheck
        run: shellcheck scripts/install-theme.sh scripts/render-preview.sh
